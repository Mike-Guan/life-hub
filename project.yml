name: LifeHub
options:
  bundleIdPrefix: com.guanshiyang
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  # Chinese is the source language; Japanese and English come from the String Catalogs (Localizable.xcstrings).
  developmentLanguage: zh-Hans
# DEV = Debug (local), STG = Staging (TestFlight internal), PROD = Release (Mike's daily build).
configs:
  Debug: debug
  Staging: release
  Release: release
packages:
  HubCore:
    path: Packages/HubCore
  CompanionKit:
    path: Packages/CompanionKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    PRODUCT_NAME: LifeHub
    PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # No custom encryption, so TestFlight doesn't ask for export compliance (lessons DW-05).
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  configs:
    # APP_BUNDLE_ID / APP_GROUP_ID per environment; AppGroup.swift mirrors the group ids.
    Debug:
      APP_BUNDLE_ID: com.guanshiyang.lifehub.dev
      APP_GROUP_ID: group.com.guanshiyang.lifehub.dev
      INFOPLIST_KEY_CFBundleDisplayName: Life Hub DEV
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG ENV_DEV
    Staging:
      APP_BUNDLE_ID: com.guanshiyang.lifehub.stg
      APP_GROUP_ID: group.com.guanshiyang.lifehub.stg
      INFOPLIST_KEY_CFBundleDisplayName: Life Hub STG
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ENV_STG
    Release:
      APP_BUNDLE_ID: com.guanshiyang.lifehub
      APP_GROUP_ID: group.com.guanshiyang.lifehub
      INFOPLIST_KEY_CFBundleDisplayName: Life Hub
targets:
  LifeHub-iOS:
    type: application
    platform: iOS
    sources:
      - Apps/Shared
      - path: Apps/iOS
        excludes:
          - Info.plist
<<<<<<< HEAD
      # Issue #481: the app runs the card control's intent itself.
      - Apps/Widgets/CardToggleIntent.swift
=======
      # Issue #481: the app runs widget mode buttons itself.
      - Apps/Widgets/SwitchModeIntent.swift
>>>>>>> origin/main
    dependencies:
      - package: HubCore
      - package: CompanionKit
      - target: LifeHub-Widgets
      - target: LifeHub-Notification
      - target: LifeHub-ScreenTime
      - target: LifeHub-Watch
    settings:
      # Family Controls is in DEV and STG; PROD gets it once Mike turns it on there. See CI-CD.md.
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Apps/iOS/LifeHub-FamilyControls.entitlements
        Staging:
          CODE_SIGN_ENTITLEMENTS: Apps/iOS/LifeHub-FamilyControls.entitlements
      base:
        CODE_SIGN_ENTITLEMENTS: Apps/iOS/LifeHub.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        # The launch screen (dark background, HAKU icon) lives in this file; the other keys are generated.
        INFOPLIST_FILE: Apps/iOS/Info.plist
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Style E is drawn on light paper only; in dark mode the status bar text turned white on cream.
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Life Hub 用位置判断你是不是到了公司、家或你设的其他地点：到公司和你设的地点自动切模式，在家用来看你是不是窝着。位置只在这台 iPhone 上用，不会上传。"
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "选「始终」后，App 关着时到了公司、家或你设的其他地点也能知道。我们只检查你是否在你设置的这几个地点附近，不记录路线，位置只在这台 iPhone 上用，不会上传。"
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Life Hub 只读取昨晚的睡眠、运动记录、最近几小时和今天的步数、今天的站立小时和日照时长，用来估计电量、判断你是不是窝在家、运动完庆祝、坐太久时陪你伸懒腰，以及晒到太阳、按时睡、走满 6000 步时给能量罐。健康数据只在这台 iPhone 上处理，不会上传；只会把算好的状态发给你自己的 Apple Watch。"
        INFOPLIST_KEY_NSMotionUsageDescription: "Life Hub 只在你从家去公司、从公司回家的路上看一眼你是在走路还是在车上，让角色跟着演；没给健康权限时，也用它数今天的步数，走满 6000 步给能量罐。运动数据只在这台 iPhone 上用，不会上传。"
    scheme: {}
  # Drives the "不对" card recording in scripts/check-card-shots.sh; CI doesn't build it.
  LifeHub-UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Apps/UITests
    dependencies:
      - target: LifeHub-iOS
    settings:
      base:
        PRODUCT_NAME: LifeHubUITests
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        TARGETED_DEVICE_FAMILY: "1"
  LifeHub-macOS:
    type: application
    platform: macOS
    sources:
      - Apps/Shared
      - Apps/macOS
    dependencies:
      - package: HubCore
      - package: CompanionKit
    settings:
      base:
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
    scheme: {}
  LifeHub-Widgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/Widgets
        excludes:
          - Info.plist
          - "*.entitlements"
      - Apps/iOS/AppGroup.swift
      - Apps/iOS/BoxingActivity.swift
      - Apps/iOS/InviteReminder.swift
    dependencies:
      - package: HubCore
      - package: CompanionKit
    settings:
      base:
        PRODUCT_NAME: LifeHubWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        INFOPLIST_FILE: Apps/Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/Widgets/LifeHubWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  LifeHub-Notification:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/Notification
        excludes:
          - Info.plist
          - "*.entitlements"
      - Apps/iOS/AppGroup.swift
      - Apps/iOS/InviteReminder.swift
      - Apps/iOS/OffWorkReminder.swift
    dependencies:
      - package: HubCore
      - package: CompanionKit
    settings:
      base:
        PRODUCT_NAME: LifeHubNotification
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).notification
        INFOPLIST_FILE: Apps/Notification/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/Notification/LifeHubNotification.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  LifeHub-ScreenTime:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/ScreenTime
        excludes:
          - Info.plist
          - "*.entitlements"
      - Apps/iOS/AppGroup.swift
      - Apps/iOS/InviteReminder.swift
      - Apps/iOS/ScrollWatch.swift
    dependencies:
      - package: HubCore
    settings:
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Apps/ScreenTime/LifeHubScreenTime-FamilyControls.entitlements
        Staging:
          CODE_SIGN_ENTITLEMENTS: Apps/ScreenTime/LifeHubScreenTime-FamilyControls.entitlements
      base:
        PRODUCT_NAME: LifeHubScreenTime
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).screentime
        INFOPLIST_FILE: Apps/ScreenTime/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/ScreenTime/LifeHubScreenTime.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  # Issue #160. A watch app that only shows HAKU, embedded in the iOS app, with its own widgets.
  LifeHub-Watch:
    type: application
    platform: watchOS
    sources:
      - path: Apps/Watch
        excludes:
          - "*.entitlements"
      - Apps/iOS/AppGroup.swift
    dependencies:
      - package: HubCore
      - package: CompanionKit
      - target: LifeHub-WatchWidgets
    settings:
      base:
        PRODUCT_NAME: LifeHubWatch
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).watchkitapp
        CODE_SIGN_ENTITLEMENTS: Apps/Watch/LifeHubWatch.entitlements
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: $(APP_BUNDLE_ID)
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    scheme: {}
  LifeHub-WatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: Apps/WatchWidgets
        excludes:
          - Info.plist
          - "*.entitlements"
      - Apps/iOS/AppGroup.swift
    dependencies:
      - package: HubCore
      - package: CompanionKit
    settings:
      base:
        PRODUCT_NAME: LifeHubWatchWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).watchkitapp.widgets
        INFOPLIST_FILE: Apps/WatchWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/WatchWidgets/LifeHubWatchWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
schemes:
  CheckCard:
    build:
      targets:
        LifeHub-iOS: all
        LifeHub-UITests: [test]
    test:
      config: Debug
      targets:
        - LifeHub-UITests
