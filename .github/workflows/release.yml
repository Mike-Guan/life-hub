name: release

# STG: every push to main uploads a Staging build to TestFlight.
# PROD: a tag vX.Y.Z (matching MARKETING_VERSION) uploads a Release build to TestFlight.
# Both only run after the full CI passes, and skip with a notice until signing secrets are set.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  signing:
    name: Check signing secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8_BASE64" ] || [ -z "$DEVELOPMENT_TEAM" ]; then
            echo "::notice::TestFlight upload skipped: add ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64 and DEVELOPMENT_TEAM secrets (docs/05 Engineering/CI-CD.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  testflight:
    name: Upload ${{ startsWith(github.ref, 'refs/tags/') && 'PROD' || 'STG' }} to TestFlight
    needs: [ci, signing]
    if: needs.signing.outputs.ready == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      CONFIGURATION: ${{ startsWith(github.ref, 'refs/tags/') && 'Release' || 'Staging' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches MARKETING_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"/\1/p' project.yml)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $VERSION in project.yml"
            exit 1
          fi

      - name: Select Xcode 26 and install XcodeGen
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          brew install xcodegen
          xcodegen generate

      - name: Archive and upload
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$KEY_PATH"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # Build number only goes up: one per workflow run (lessons DW-05).
          BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))

          xcodebuild archive -quiet \
            -project LifeHub.xcodeproj -scheme LifeHub-iOS \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LifeHub.xcarchive" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            "${AUTH[@]}"

          sed "s/TEAM_ID/$DEVELOPMENT_TEAM/" scripts/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LifeHub.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}"

          rm -f "$KEY_PATH"
          echo "::notice::Uploaded $CONFIGURATION build $BUILD_NUMBER to TestFlight"
