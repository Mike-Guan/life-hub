name: recordings

# Records 10 s clips of the iPhone home screen and the watch face in each mode and character, with motion
# on, for reviewing animation. Clips go to the artifact and to the throwaway branch out/recordings (force-pushed,
# one commit, never merged), because some readers can't download artifacts. Never committed to main.
on:
  workflow_dispatch:
  push:
    branches: [chore/recordings]
    paths: [.github/workflows/recordings.yml, scripts/recordings.sh]

concurrency:
  group: recordings-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  recordings:
    name: Record animation clips
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # Leaves time for the upload and push steps when a simulator hangs.
      - name: Record clips
        timeout-minutes: 45
        run: scripts/recordings.sh

      - name: Upload clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recordings
          path: build/recordings
          retention-days: 14
          if-no-files-found: ignore

      - name: Push clips to out/watch-no-mode
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          [ -d build/recordings ] || exit 0
          cd build/recordings
          git init -q -b out/watch-no-mode
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Animation clips from ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" out/watch-no-mode
