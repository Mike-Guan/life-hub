name: check-card

# Draws the "不对" card screenshots for UI 审核 (Issue #236) and pushes them to the out/check-card
# branch. Push a branch named chore/check-card-shots to run it, or run it by hand.
on:
  workflow_dispatch:
  push:
    branches: [chore/check-card-shots]

concurrency:
  group: check-card-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  shots:
    name: Draw the 不对 card
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Draw screenshots
        run: scripts/check-card-shots.sh

      - name: Push screenshots to out/check-card
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          [ -d docs/screenshots/check-card ] || exit 0
          cd docs/screenshots/check-card
          git init -q -b out/check-card
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "不对 card screenshots from ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" out/check-card
